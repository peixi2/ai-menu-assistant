<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}AI 点餐助手「小餐」{% endblock %}</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; background: #fff7ed; min-height: 100vh; }
  .top-bar {
    background: #f97316;
    color: #fff;
    padding: 12px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
  }
  .top-bar .brand { font-size: 18px; font-weight: bold; }
  .top-bar .brand a { color: #fff; text-decoration: none; }
  .top-bar .nav a {
    color: #fff;
    text-decoration: none;
    margin-left: 16px;
    font-size: 14px;
    opacity: .95;
  }
  .top-bar .nav a:hover { text-decoration: underline; }

  /* ---- 悬浮 AI 聊天窗 ---- */
  .ai-fab {
    position: fixed;
    right: 24px;
    bottom: 24px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: #f97316;
    color: #fff;
    font-size: 26px;
    border: none;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(249,115,22,.45);
    z-index: 999;
  }
  .ai-panel {
    position: fixed;
    right: 24px;
    bottom: 92px;
    width: 360px;
    height: 480px;
    background: linear-gradient(160deg, #fff7ed, #fef3c7);
    border-radius: 14px;
    box-shadow: 0 8px 30px rgba(0,0,0,.2);
    display: none;
    flex-direction: column;
    overflow: hidden;
    z-index: 999;
  }
  .ai-panel.open { display: flex; }
  .ai-panel-head {
    background: #f97316;
    color: #fff;
    padding: 10px 14px;
    font-weight: bold;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .ai-panel-head small { font-weight: normal; font-size: 12px; opacity: .9; }
  .ai-panel-head button {
    background: none;
    border: none;
    color: #fff;
    font-size: 18px;
    cursor: pointer;
  }
  .ai-messages {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .bubble {
    max-width: 85%;
    padding: 8px 12px;
    border-radius: 12px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 14px;
  }
  .bubble.user {
    align-self: flex-end;
    background: #f97316;
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .bubble.ai {
    align-self: flex-start;
    background: #fff;
    color: #333;
    border: 1px solid #fde68a;
    border-bottom-left-radius: 4px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  .bubble.tool {
    align-self: center;
    background: #f1f5f9;
    color: #64748b;
    font-size: 12px;
    border-radius: 10px;
    padding: 5px 10px;
  }
  .bubble.error { align-self: center; background: #fee2e2; color: #b91c1c; font-size: 12px; }
  .bubble.wait { align-self: flex-start; background: #fff; color: #999; }
  .dish-wall {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 2px 2px 6px;
  }
  .dish-card {
    flex: 0 0 auto;
    width: 104px;
    background: #fff;
    border: 1px solid #fde68a;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  .dish-card img { width: 100%; height: 78px; object-fit: cover; display: block; }
  .dish-info { padding: 5px 7px; }
  .dish-name {
    font-size: 12px;
    color: #333;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .dish-price { font-size: 11px; color: #f97316; font-weight: bold; }
  .ai-input-bar {
    display: flex;
    gap: 6px;
    padding: 10px;
    background: #fff;
    border-top: 1px solid #fde68a;
  }
  .ai-input-bar input {
    flex: 1;
    padding: 8px 12px;
    border: 1px solid #fcd34d;
    border-radius: 18px;
    font-size: 14px;
    outline: none;
  }
  .ai-input-bar input:focus { border-color: #f97316; }
  .ai-input-bar button {
    padding: 8px 16px;
    background: #f97316;
    color: #fff;
    border: none;
    border-radius: 18px;
    font-size: 14px;
    cursor: pointer;
  }
  .ai-input-bar button:disabled { background: #fdba74; cursor: not-allowed; }
</style>
</head>
<body>
<div class="top-bar">
  <div class="brand"><a href="{{ url_for('index') }}">AI 点餐助手「小餐」</a></div>
  <div class="nav">
    <a href="{{ url_for('index') }}">首页</a>
    {% if session.get('username') %}
      {% if session.get('role') == 1 %}
        <a href="{{ url_for('admin_main') }}">后台管理</a>
      {% endif %}
      <a href="#">欢迎，{{ session['username'] }}</a>
      <a href="{{ url_for('logout') }}">退出登录</a>
    {% else %}
      <a href="{{ url_for('login') }}">登录</a>
      <a href="{{ url_for('register') }}">注册</a>
    {% endif %}
  </div>
</div>

{% block content %}{% endblock %}

<!-- 悬浮 AI 聊天窗（所有页面通用） -->
<button class="ai-fab" id="aiFab" title="问小餐">🤖</button>
<div class="ai-panel" id="aiPanel">
  <div class="ai-panel-head">
    <span>小餐 · AI 助手<small>　问问我菜单上有什么好吃的～</small></span>
    <button id="aiClose">✕</button>
  </div>
  <div class="ai-messages" id="aiMessages"></div>
  <div class="ai-input-bar">
    <input id="aiInput" placeholder="比如：有什么主食？" autocomplete="off">
    <button id="aiSend">发送</button>
  </div>
</div>

<script>
(function () {
  const fab = document.getElementById("aiFab");
  const panel = document.getElementById("aiPanel");
  const closeBtn = document.getElementById("aiClose");
  const box = document.getElementById("aiMessages");
  const input = document.getElementById("aiInput");
  const sendBtn = document.getElementById("aiSend");

  fab.addEventListener("click", () => {
    panel.classList.toggle("open");
    if (panel.classList.contains("open")) input.focus();
  });
  closeBtn.addEventListener("click", () => panel.classList.remove("open"));

  // 每个浏览器一个会话 id，存在 localStorage 里，刷新页面对话不丢
  let sessionId = localStorage.getItem("ai_sid");
  if (!sessionId) {
    sessionId = (crypto.randomUUID && crypto.randomUUID()) || Math.random().toString(36).slice(2);
    localStorage.setItem("ai_sid", sessionId);
  }

  function addBubble(text, cls) {
    const div = document.createElement("div");
    div.className = "bubble " + cls;
    div.textContent = text;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
    return div;
  }

  // AI 调工具查到的菜品，展示成图片卡片墙
  function addDishWall(dishes) {
    const wall = document.createElement("div");
    wall.className = "dish-wall";
    const seen = new Set();
    for (const d of dishes) {
      if (!d.image || seen.has(d.name)) continue;  // 按菜名去重
      seen.add(d.name);
      const card = document.createElement("div");
      card.className = "dish-card";
      const img = document.createElement("img");
      img.src = "/img/" + encodeURIComponent(d.image.split("/").pop());
      img.alt = d.name;
      img.loading = "lazy";
      img.onerror = () => card.remove();  // 图片加载失败就整张卡片不显示
      const info = document.createElement("div");
      info.className = "dish-info";
      const name = document.createElement("div");
      name.className = "dish-name";
      name.textContent = d.name;
      name.title = d.category + " · " + d.name;
      const price = document.createElement("div");
      price.className = "dish-price";
      price.textContent = "¥" + parseFloat(d.price);
      info.appendChild(name);
      info.appendChild(price);
      card.appendChild(img);
      card.appendChild(info);
      wall.appendChild(card);
    }
    if (wall.children.length) {
      box.appendChild(wall);
      box.scrollTop = box.scrollHeight;
    }
  }

  async function send() {
    const text = input.value.trim();
    if (!text || sendBtn.disabled) return;
    input.value = "";
    addBubble(text, "user");
    sendBtn.disabled = true;
    const wait = addBubble("小餐正在想…", "wait");
    try {
      const resp = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sessionId, message: text }),
      });
      const data = await resp.json();
      wait.remove();
      if (!resp.ok) {
        addBubble("出错了：" + (data.error || "未知错误"), "error");
        return;
      }
      if (data.tool_calls && data.tool_calls.length) {
        addBubble("emmmm思考中.....", "tool");
      }
      if (data.dishes && data.dishes.length) {
        addDishWall(data.dishes);
      }
      addBubble(data.answer, "ai");
    } catch (e) {
      wait.remove();
      addBubble("网络出错了：" + e, "error");
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  sendBtn.addEventListener("click", send);
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
})();
</script>
</body>
</html>

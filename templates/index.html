<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 点餐助手「小餐」</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: linear-gradient(160deg, #fff7ed, #fef3c7);
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .chat-box {
    width: 100%;
    max-width: 720px;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 12px 18px;
    background: #f97316;
    color: #fff;
    font-size: 18px;
    font-weight: bold;
    text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
  }
  header small { font-weight: normal; font-size: 12px; opacity: .9; }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .bubble {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 15px;
  }
  .bubble.user {
    align-self: flex-end;
    background: #f97316;
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .bubble.ai {
    align-self: flex-start;
    background: #fff;
    color: #333;
    border: 1px solid #fde68a;
    border-bottom-left-radius: 4px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  .bubble.tool {
    align-self: center;
    background: #f1f5f9;
    color: #64748b;
    font-size: 12px;
    border-radius: 10px;
    padding: 6px 12px;
  }
  .bubble.error { align-self: center; background: #fee2e2; color: #b91c1c; font-size: 13px; }
  .bubble.wait { align-self: flex-start; background: #fff; color: #999; }
  .dish-wall {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding: 4px 2px 8px;
  }
  .dish-card {
    flex: 0 0 auto;
    width: 120px;
    background: #fff;
    border: 1px solid #fde68a;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  .dish-card img { width: 100%; height: 90px; object-fit: cover; display: block; }
  .dish-info { padding: 6px 8px; }
  .dish-name {
    font-size: 13px;
    color: #333;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .dish-price { font-size: 12px; color: #f97316; font-weight: bold; }
  .input-bar {
    display: flex;
    gap: 8px;
    padding: 12px;
    background: #fff;
    border-top: 1px solid #fde68a;
  }
  #input {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid #fcd34d;
    border-radius: 20px;
    font-size: 15px;
    outline: none;
  }
  #input:focus { border-color: #f97316; }
  #send {
    padding: 10px 22px;
    background: #f97316;
    color: #fff;
    border: none;
    border-radius: 20px;
    font-size: 15px;
    cursor: pointer;
  }
  #send:disabled { background: #fdba74; cursor: not-allowed; }
</style>
</head>
<body>
<div class="chat-box">
  <header>AI 点餐助手「小餐」<br><small>问问我菜单上有什么好吃的～</small></header>
  <div id="messages"></div>
  <div class="input-bar">
    <input id="input" placeholder="比如：有什么主食？" autocomplete="off">
    <button id="send">发送</button>
  </div>
</div>
<script>
const sessionId = (crypto.randomUUID && crypto.randomUUID()) || Math.random().toString(36).slice(2);
const box = document.getElementById("messages");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");

function addBubble(text, cls) {
  const div = document.createElement("div");
  div.className = "bubble " + cls;
  div.textContent = text;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
  return div;
}

// AI 调工具查到的菜品，展示成图片卡片墙
function addDishWall(dishes) {
  const wall = document.createElement("div");
  wall.className = "dish-wall";
  const seen = new Set();
  for (const d of dishes) {
    if (!d.image || seen.has(d.name)) continue;  // 按菜名去重
    seen.add(d.name);
    const card = document.createElement("div");
    card.className = "dish-card";
    const img = document.createElement("img");
    img.src = "/img/" + encodeURIComponent(d.image.split("/").pop());
    img.alt = d.name;
    img.loading = "lazy";
    img.onerror = () => card.remove();  // 图片加载失败就整张卡片不显示
    const info = document.createElement("div");
    info.className = "dish-info";
    const name = document.createElement("div");
    name.className = "dish-name";
    name.textContent = d.name;
    name.title = d.category + " · " + d.name;
    const price = document.createElement("div");
    price.className = "dish-price";
    price.textContent = "¥" + parseFloat(d.price);
    info.appendChild(name);
    info.appendChild(price);
    card.appendChild(img);
    card.appendChild(info);
    wall.appendChild(card);
  }
  if (wall.children.length) {
    box.appendChild(wall);
    box.scrollTop = box.scrollHeight;
  }
}

async function send() {
  const text = input.value.trim();
  if (!text || sendBtn.disabled) return;
  input.value = "";
  addBubble(text, "user");
  sendBtn.disabled = true;
  const wait = addBubble("小餐正在想…", "wait");
  try {
    const resp = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sessionId, message: text }),
    });
    const data = await resp.json();
    wait.remove();
    if (!resp.ok) {
      addBubble("出错了：" + (data.error || "未知错误"), "error");
      return;
    }
    if (data.tool_calls && data.tool_calls.length) {
      addBubble("emmmm思考中.....", "tool");
    }
    if (data.dishes && data.dishes.length) {
      addDishWall(data.dishes);
    }
    addBubble(data.answer, "ai");
  } catch (e) {
    wait.remove();
    addBubble("网络出错了：" + e, "error");
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}

sendBtn.addEventListener("click", send);
input.addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
input.focus();
</script>
</body>
</html>

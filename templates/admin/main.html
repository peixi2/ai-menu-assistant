{% extends "base.html" %}
{% block title %}后台管理 - AI 点餐助手「小餐」{% endblock %}
{% block content %}
<style>
  .admin-wrap { max-width: 900px; margin: 40px auto; padding: 0 20px; }
  .admin-wrap h2 { color: #9a3412; margin-bottom: 20px; }
  .admin-cards { display: flex; gap: 20px; flex-wrap: wrap; }
  .admin-card {
    flex: 1;
    min-width: 220px;
    background: #fff;
    border: 1px solid #fde68a;
    border-radius: 12px;
    padding: 24px;
    text-align: center;
    text-decoration: none;
    color: #333;
    box-shadow: 0 2px 8px rgba(0,0,0,.06);
    transition: transform .2s;
  }
  .admin-card:hover { transform: translateY(-3px); }
  .admin-card .num { font-size: 36px; font-weight: bold; color: #f97316; }
  .admin-card .label { margin-top: 8px; font-size: 16px; }
  .admin-card .hint { margin-top: 6px; font-size: 12px; color: #999; }
</style>
<div class="admin-wrap">
  <h2>后台管理</h2>
  <div class="admin-cards">
    <a class="admin-card" href="{{ url_for('admin_foods') }}">
      <div class="num">{{ food_count }}</div>
      <div class="label">菜品管理</div>
      <div class="hint">新增 / 编辑 / 删除菜品</div>
    </a>
    <a class="admin-card" href="{{ url_for('admin_notices') }}">
      <div class="num">{{ notice_count }}</div>
      <div class="label">公告管理</div>
      <div class="hint">新增 / 编辑 / 删除公告</div>
    </a>
    <a class="admin-card" href="{{ url_for('admin_users') }}">
      <div class="num">{{ user_count }}</div>
      <div class="label">用户管理</div>
      <div class="hint">查看用户 / 修改角色</div>
    </a>
  </div>
</div>
{% endblock %}

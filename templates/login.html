{% extends "base.html" %}
{% block title %}登录 - AI 点餐助手「小餐」{% endblock %}
{% block content %}
<style>
  .form-wrap {
    display: flex;
    justify-content: center;
    padding: 60px 20px;
  }
  .form-card {
    background: #fff;
    border: 1px solid #fde68a;
    border-radius: 14px;
    box-shadow: 0 4px 16px rgba(0,0,0,.08);
    width: 360px;
    padding: 32px 28px;
    text-align: center;
  }
  .form-card h2 { color: #9a3412; margin-bottom: 6px; }
  .form-card .sub { color: #999; font-size: 13px; margin-bottom: 22px; }
  .form-card input {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid #fcd34d;
    border-radius: 20px;
    font-size: 14px;
    outline: none;
    margin-bottom: 14px;
  }
  .form-card input:focus { border-color: #f97316; }
  .form-card button {
    width: 100%;
    padding: 10px;
    background: #f97316;
    color: #fff;
    border: none;
    border-radius: 20px;
    font-size: 15px;
    cursor: pointer;
  }
  .form-card button:hover { background: #ea580c; }
  .form-card .msg { color: #16a34a; font-size: 13px; margin-bottom: 12px; }
  .form-card .err { color: #b91c1c; font-size: 13px; margin-bottom: 12px; }
  .form-card .switch { margin-top: 16px; font-size: 13px; color: #666; }
  .form-card .switch a { color: #f97316; text-decoration: none; }
  .form-card .switch a:hover { text-decoration: underline; }
</style>
<div class="form-wrap">
  <form class="form-card" method="post">
    <h2>登录</h2>
    <p class="sub">欢迎回来，小餐等你～</p>
    {% if msg or request.args.get('registered') %}<p class="msg">{{ msg or '注册成功，请登录' }}</p>{% endif %}
    {% if error %}<p class="err">{{ error }}</p>{% endif %}
    <input type="text" name="username" placeholder="用户名" value="{{ username or request.args.get('username') or '' }}" required>
    <input type="password" name="password" placeholder="密码" required>
    <button type="submit">登 录</button>
    <p class="switch">还没有账号？<a href="{{ url_for('register') }}">去注册</a></p>
  </form>
</div>
{% endblock %}
